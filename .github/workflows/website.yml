name: Website checks and Cloudflare Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, pages-cms, 'content/**']
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy the validated website
        required: true
        type: choice
        default: preview
        options: [preview, production]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: npm run test:cloudflare
      - run: npm run build:cloudflare
      - run: SITE_NOINDEX=1 npm run build:cloudflare
      - uses: actions/upload-artifact@v7
        with:
          name: offline-website-preview
          path: DigitalTalha-preview.html
          if-no-files-found: error

  preview:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.target == 'preview') ||
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/pages-cms' || startsWith(github.ref, 'refs/heads/content/')))
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: cloudflare-preview
      url: https://pages-cms.digitaltalha-migration.pages.dev/
    concurrency:
      group: cloudflare-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: SITE_NOINDEX=1 npm run build:cloudflare
      - name: Upload isolated preview and verify routing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare preview credentials are missing. Download the offline preview from the check job."
            exit 0
          fi
          npm exec --yes --package wrangler@4.162.0 -- wrangler pages deploy dist --project-name digitaltalha-migration --branch pages-cms --commit-hash "$GITHUB_SHA" --commit-dirty=true
          python3 cloudflare/check_runtime.py https://pages-cms.digitaltalha-migration.pages.dev/

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: cloudflare-production
      url: https://digitaltalha.com/
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: npm run build:cloudflare
      - name: Publish checked build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the Cloudflare Pages token in the cloudflare-production environment}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the Cloudflare account ID in the cloudflare-production environment}"
          npm exec --yes --package wrangler@4.162.0 -- wrangler pages deploy dist --project-name digitaltalha-migration --branch cloudflare-production --commit-hash "$GITHUB_SHA" --commit-dirty=true
